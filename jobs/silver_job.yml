resources:
  jobs:
    silver_job:
      name: Silver Job
      tasks:
        - task_key: customers
          notebook_task:
            notebook_path: src/silver/notebook/clean
            base_parameters:
              table_name: customers
            source: GIT
          environment_key: Default
        - task_key: transactions
          notebook_task:
            notebook_path: src/silver/notebook/clean
            base_parameters:
              table_name: transactions
            source: GIT
          environment_key: Default
        - task_key: operation_status_code
          notebook_task:
            notebook_path: src/silver/notebook/clean
            base_parameters:
              table_name: operation_status_code
            source: GIT
          environment_key: Default
      git_source:
        git_url: https://github.com/lucadess/transactions-case.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "5"
      performance_target: PERFORMANCE_OPTIMIZED
