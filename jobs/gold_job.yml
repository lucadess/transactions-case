resources:
  jobs:
    gold_job:
      name: Gold Job
      tasks:
        - task_key: transactions
          notebook_task:
            notebook_path: src/gold/notebook/generate
            base_parameters:
              table_name: transactions
            source: GIT
          environment_key: Default
      git_source:
        git_url: https://github.com/lucadess/transactions-case.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "5"
      performance_target: PERFORMANCE_OPTIMIZED
